@if (canRead()) {
  <app-grid
    [title]="'admin.notifications.title'"
    [columns]="columns"
    [showAddButton]="false"
    [templateFilters]="tabs"
    [templateCostumFields]="cell"
    (onRowSelect)="onRowSelect($event)"
    [$data]="gridService"
  >
    <ng-container titleRight>
      @if (canWrite()) {
        <a pButton routerLink="/notifications/send">
          <i class="pi pi-send"></i>
          {{ 'admin.notifications.send' | transloco }}
        </a>
      }
    </ng-container>

    <ng-template #costumTableFilter>
      <app-table-filter
        [config]="filterConfig"
        [debounceTime]="500"
        (filterChange)="onFilterChange($event)"
        (filterReset)="onFilterReset()"
      />
    </ng-template>
  </app-grid>

  <ng-template #tabs>
    <app-notifications-tabs />
  </ng-template>

  <ng-template #cell let-column="column" let-row="row">
    @if (column.field === 'status') {
      <p-tag [value]="'admin.notifications.statuses.' + row.status | transloco" [severity]="statusSeverity[row.status]" />
    } @else {
      <p-tag [value]="'admin.notifications.targets.' + row.target | transloco" severity="info" />
    }
  </ng-template>
} @else {
  <div class="p-6">
    <p-message severity="warn" [text]="'admin.common.noPermission' | transloco" />
  </div>
}
