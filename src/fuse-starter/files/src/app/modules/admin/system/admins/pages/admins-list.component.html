@if (canRead()) {
  <app-grid
    [title]="'admin.system.admins.title'"
    [columns]="columns"
    [addButtonText]="'admin.system.admins.addNew'"
    addButtonIcon="pi pi-plus"
    [showAddButton]="canWrite()"
    [templateCostumFields]="cell"
    (onClickAdd)="onAddClick()"
    (onRowSelect)="onRowSelect($event)"
    [$data]="gridService"
  >
    <ng-template #costumTableFilter>
      <app-table-filter
        [config]="filterConfig"
        [debounceTime]="500"
        (filterChange)="onFilterChange($event)"
        (filterReset)="onFilterReset()"
      />
    </ng-template>
  </app-grid>

  <ng-template #cell let-column="column" let-row="row">
    @switch (column.field) {
      @case ('role.name') {
        <span>{{ row.role?.name ?? '-' }}</span>
      }
      @case ('isBlocked') {
        <p-tag
          [value]="(row.isBlocked ? 'admin.system.admins.blocked' : 'admin.system.admins.active') | transloco"
          [severity]="row.isBlocked ? 'danger' : 'success'"
        />
      }
    }
  </ng-template>
} @else {
  <div class="p-6">
    <p-message severity="warn" [text]="'admin.common.noPermission' | transloco" />
  </div>
}
