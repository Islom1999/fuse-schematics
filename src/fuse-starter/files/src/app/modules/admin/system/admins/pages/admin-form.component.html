<div class="flex flex-col gap-4 p-2">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <formly-form [form]="form" [fields]="fields" [model]="model" />

    @if (canWrite) {
      <form-action-buttons
        [isEditMode]="isEditMode"
        [isFormValid]="form.valid"
        (delete)="onDelete()"
        (cancel)="onCancel()"
        (submit)="onSubmit()"
      />
    } @else {
      <div class="mt-6 flex justify-end border-t pt-4">
        <p-button
          [label]="'admin.common.close' | transloco"
          severity="secondary"
          [outlined]="true"
          type="button"
          (onClick)="onCancel()"
        />
      </div>
    }
  </form>

  @if (isEditMode && id) {
    <app-admin-security [adminId]="id" [isBlocked]="!!model.isBlocked" (blockedChange)="onBlockedChange()" />
  }
</div>
