<app-auth-split-shell>
  <img class="w-12" src="assets/images/logo/logo.svg" [alt]="'auth.logoAlt' | transloco" />
  <h1 class="mt-8 text-4xl font-extrabold leading-10 tracking-tight">{{ 'auth.forgotPassword.title' | transloco }}</h1>
  <p class="mt-0.5 font-medium">{{ 'auth.forgotPassword.subtitle' | transloco }}</p>

  @if (alert(); as current) {
    @for (item of [current]; track item.id) {
      <app-auth-alert class="mt-8" [alert]="item" />
    }
  }

  <form class="mt-8" novalidate [formGroup]="form" (ngSubmit)="submit()">
    <div>
      <label class="text-sm font-medium leading-6 text-secondary" for="forgot-email">
        {{ 'auth.emailLabel' | transloco }}
      </label>
      <input
        id="forgot-email"
        class="mt-2 h-[42px] w-full"
        type="email"
        autocomplete="email"
        pInputText
        formControlName="email"
        [invalid]="!!emailError()"
      />
      @if (emailError(); as key) {
        <small class="mt-1 block text-sm text-red-500">{{ key | transloco }}</small>
      }
    </div>

    <button pButton type="submit" class="mt-3 h-[42px] w-full" [disabled]="busy()">
      @if (busy()) {
        <app-auth-spinner />
      } @else {
        <span pButtonLabel>{{ 'auth.forgotPassword.submit' | transloco }}</span>
      }
    </button>

    <div class="mt-8 text-md font-medium text-secondary">
      <span>{{ 'auth.returnTo' | transloco }}</span>
      <a class="ml-1 text-primary-500 hover:underline" routerLink="/sign-in">{{ 'auth.signInLink' | transloco }}</a>
    </div>
  </form>
</app-auth-split-shell>
