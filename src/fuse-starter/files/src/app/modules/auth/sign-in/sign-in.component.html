<app-auth-split-shell>
  <img class="w-12" src="assets/images/logo/logo.svg" [alt]="'auth.logoAlt' | transloco" />
  <h1 class="mt-8 text-4xl font-extrabold leading-10 tracking-tight">{{ 'auth.signIn.title' | transloco }}</h1>

  @if (alert(); as current) {
    @for (item of [current]; track item.id) {
      <app-auth-alert class="mt-8" [alert]="item" />
    }
  }

  <form class="mt-8" novalidate [formGroup]="form" (ngSubmit)="submit()">
    <div class="flex flex-col gap-6">
      <div>
        <label class="text-sm font-medium leading-6 text-secondary" for="sign-in-email">
          {{ 'auth.emailLabel' | transloco }}
        </label>
        <input
          id="sign-in-email"
          class="mt-2 h-[42px] w-full"
          type="email"
          autocomplete="username"
          pInputText
          formControlName="email"
          [invalid]="!!error('email')"
        />
        @if (error('email'); as key) {
          <small class="mt-1 block text-sm text-red-500">{{ key | transloco }}</small>
        }
      </div>

      <div>
        <label class="text-sm font-medium leading-6 text-secondary" for="sign-in-password">
          {{ 'auth.passwordLabel' | transloco }}
        </label>
        <div class="relative mt-2">
          <input
            #passwordInput
            id="sign-in-password"
            class="h-[42px] w-full pr-12"
            type="password"
            autocomplete="current-password"
            pInputText
            formControlName="password"
            [invalid]="!!error('password')"
          />
          <app-auth-password-toggle [target]="passwordInput" />
        </div>
        @if (error('password'); as key) {
          <small class="mt-1 block text-sm text-red-500">{{ key | transloco }}</small>
        }
      </div>

      <div class="flex w-full items-center justify-between">
        <div class="flex items-center">
          <p-checkbox inputId="sign-in-remember" formControlName="rememberMe" [binary]="true" />
          <label class="ml-2 text-md" for="sign-in-remember">{{ 'auth.signIn.rememberMe' | transloco }}</label>
        </div>
        <a class="text-md font-medium text-primary-500 hover:underline" routerLink="/forgot-password">
          {{ 'auth.signIn.forgotPassword' | transloco }}
        </a>
      </div>
    </div>

    <button pButton type="submit" class="mt-6 h-[42px] w-full" [disabled]="busy()">
      @if (busy()) {
        <app-auth-spinner />
      } @else {
        <span pButtonLabel>{{ 'auth.signIn.submit' | transloco }}</span>
      }
    </button>
  </form>
</app-auth-split-shell>
