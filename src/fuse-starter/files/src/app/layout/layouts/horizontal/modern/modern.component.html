<ui-loading-bar />

<!-- Small screens: the horizontal navigation becomes an over-mode drawer -->
@if (isScreenSmall()) {
  <ui-vertical-navigation
    class="dark bg-gray-900 print:hidden"
    name="mainNavigation"
    mode="over"
    [opened]="false"
    [navigation]="navigation().default"
    [ariaLabel]="'layout.mainNavigation' | transloco"
  >
    <div uiVerticalNavigationContentHeader class="flex items-center h-20 pt-6 px-8">
      <img
        class="w-30"
        src="assets/images/logo/logo-text-on-dark.svg"
        [alt]="'layout.logoAlt' | transloco"
      />
    </div>
  </ui-vertical-navigation>
}

<div class="flex flex-col flex-auto w-full min-w-0">
  <header
    class="relative flex flex-0 items-center w-full h-16 sm:h-20 px-4 md:px-6 z-49 shadow bg-card dark:shadow-none dark:border-b dark:bg-transparent print:hidden"
  >
    @if (!isScreenSmall()) {
      <div class="flex items-center mx-2 lg:mr-8">
        <div class="hidden lg:flex">
          <img
            class="w-24 dark:hidden"
            src="assets/images/logo/logo-text.svg"
            [alt]="'layout.logoAlt' | transloco"
          />
          <img
            class="hidden w-24 dark:flex"
            src="assets/images/logo/logo-text-on-dark.svg"
            [alt]="'layout.logoAlt' | transloco"
          />
        </div>
        <img
          class="flex w-8 lg:hidden"
          src="assets/images/logo/logo.svg"
          [alt]="'layout.logoAlt' | transloco"
        />
      </div>
      <ui-horizontal-navigation
        class="mr-2"
        name="mainNavigation"
        [navigation]="navigation().horizontal"
        [ariaLabel]="'layout.mainNavigation' | transloco"
      />
    } @else {
      <button
        type="button"
        pButton
        class="p-button-icon-only w-10 h-10"
        [text]="true"
        [rounded]="true"
        [attr.aria-label]="'layout.toggleNavigation' | transloco"
        (click)="toggleNavigation('mainNavigation')"
      >
        <ui-icon svgIcon="heroicons_outline:bars-3" />
      </button>
    }

    <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
      <app-languages />
      <ui-fullscreen class="hidden md:block" [tooltip]="'layout.fullscreen' | transloco" />
      <app-search appearance="bar" />
      <app-notifications />
      <app-user />
    </div>
  </header>

  <main class="flex flex-col flex-auto w-full">
    <router-outlet />
  </main>

  <footer
    class="relative flex flex-0 items-center w-full h-14 sm:h-20 px-4 md:px-6 z-49 border-t bg-card dark:bg-transparent print:hidden"
  >
    <span class="font-medium text-secondary">{{
      'layout.footer.copyright' | transloco: { year: currentYear }
    }}</span>
  </footer>
</div>
