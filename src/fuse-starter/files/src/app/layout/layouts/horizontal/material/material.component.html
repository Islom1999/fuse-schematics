<ui-loading-bar />

<!-- Small screens: the horizontal navigation becomes an over-mode drawer -->
@if (isScreenSmall()) {
  <ui-vertical-navigation
    class="dark bg-gray-900 print:hidden"
    name="mainNavigation"
    mode="over"
    [opened]="false"
    [navigation]="navigation().default"
    [ariaLabel]="'layout.mainNavigation' | transloco"
  >
    <div uiVerticalNavigationContentHeader class="flex items-center h-20 pt-6 px-8">
      <img
        class="w-30"
        src="assets/images/logo/logo-text-on-dark.svg"
        [alt]="'layout.logoAlt' | transloco"
      />
    </div>
  </ui-vertical-navigation>
}

<div class="flex flex-col flex-auto items-center w-full min-w-0 bg-gray-200 dark:bg-card">
  <!-- Primary band with the header card -->
  <div class="flex justify-center w-full sm:px-8 bg-primary-700 print:hidden">
    <header
      class="flex flex-col w-full max-w-360 sm:mt-8 md:mt-12 sm:py-3 md:pt-4 md:pb-3 border-b sm:rounded-t-xl sm:shadow-2xl bg-card"
    >
      <!-- Top row: logo and actions -->
      <div class="relative flex items-center w-full h-16 px-4 md:px-6">
        @if (!isScreenSmall()) {
          <div class="flex items-center mx-2">
            <img
              class="w-24 dark:hidden"
              src="assets/images/logo/logo-text.svg"
              [alt]="'layout.logoAlt' | transloco"
            />
            <img
              class="hidden w-24 dark:flex"
              src="assets/images/logo/logo-text-on-dark.svg"
              [alt]="'layout.logoAlt' | transloco"
            />
          </div>
        } @else {
          <button
            type="button"
            pButton
            class="p-button-icon-only w-10 h-10"
            [text]="true"
            [rounded]="true"
            [attr.aria-label]="'layout.toggleNavigation' | transloco"
            (click)="toggleNavigation('mainNavigation')"
          >
            <ui-icon svgIcon="heroicons_outline:bars-3" />
          </button>
        }

        <div class="flex items-center pl-2 ml-auto space-x-1 sm:space-x-2">
          <app-languages />
          <ui-fullscreen class="hidden md:block" [tooltip]="'layout.fullscreen' | transloco" />
          <app-search appearance="bar" />
          <app-notifications />
          <app-user />
        </div>
      </div>

      <!-- Bottom row: horizontal navigation -->
      @if (!isScreenSmall()) {
        <div class="relative flex items-center w-full h-16 px-4">
          <ui-horizontal-navigation
            name="mainNavigation"
            [navigation]="navigation().horizontal"
            [ariaLabel]="'layout.mainNavigation' | transloco"
          />
        </div>
      }
    </header>
  </div>

  <main class="flex flex-auto justify-center w-full sm:px-8">
    <div class="flex flex-col flex-auto w-full max-w-360 sm:shadow-xl bg-default">
      <router-outlet />
    </div>
  </main>

  <footer
    class="relative flex flex-0 items-center w-full max-w-360 h-14 sm:h-20 px-6 md:px-8 z-49 border-t sm:shadow-xl bg-card dark:bg-default print:hidden"
  >
    <span class="font-medium text-secondary">{{
      'layout.footer.copyright' | transloco: { year: currentYear }
    }}</span>
  </footer>
</div>
