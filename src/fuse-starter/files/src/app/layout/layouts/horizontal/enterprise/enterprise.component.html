<ui-loading-bar />

<!-- Small screens: the horizontal navigation becomes an over-mode drawer -->
@if (isScreenSmall()) {
  <ui-vertical-navigation
    class="dark bg-gray-900 print:hidden"
    name="mainNavigation"
    mode="over"
    [opened]="false"
    [navigation]="navigation().default"
    [ariaLabel]="'layout.mainNavigation' | transloco"
  >
    <div uiVerticalNavigationContentHeader class="flex items-center h-20 pt-6 px-8">
      <img
        class="w-30"
        src="assets/images/logo/logo-text-on-dark.svg"
        [alt]="'layout.logoAlt' | transloco"
      />
    </div>
  </ui-vertical-navigation>
}

<div class="flex flex-col flex-auto items-center w-full min-w-0 bg-gray-200 dark:bg-card">
  <header class="relative flex flex-col flex-0 justify-center w-full z-49 shadow print:hidden">
    <!-- Top bar: always dark -->
    <div
      class="dark relative flex flex-auto justify-center w-full px-4 md:px-8 bg-gray-800 dark:bg-gray-900"
    >
      <div class="flex items-center w-full max-w-360 h-16 sm:h-20">
        @if (!isScreenSmall()) {
          <img
            class="w-24"
            src="assets/images/logo/logo-text-on-dark.svg"
            [alt]="'layout.logoAlt' | transloco"
          />
        } @else {
          <button
            type="button"
            pButton
            class="p-button-icon-only w-10 h-10"
            [text]="true"
            [rounded]="true"
            [attr.aria-label]="'layout.toggleNavigation' | transloco"
            (click)="toggleNavigation('mainNavigation')"
          >
            <ui-icon svgIcon="heroicons_outline:bars-3" />
          </button>
        }

        <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
          <app-languages />
          <ui-fullscreen class="hidden md:block" [tooltip]="'layout.fullscreen' | transloco" />
          <app-search appearance="bar" />
          <app-notifications />
          <app-user />
        </div>
      </div>
    </div>

    <!-- Bottom bar: horizontal navigation -->
    @if (!isScreenSmall()) {
      <div class="flex flex-auto justify-center px-4 md:px-8 bg-card dark:bg-gray-700">
        <div class="relative flex items-center w-full max-w-360 h-16">
          <ui-horizontal-navigation
            class="-mx-4"
            name="mainNavigation"
            [navigation]="navigation().horizontal"
            [ariaLabel]="'layout.mainNavigation' | transloco"
          />
        </div>
      </div>
    }
  </header>

  <main class="flex flex-auto justify-center w-full sm:p-6 md:p-8">
    <div
      class="flex flex-col flex-auto w-full sm:max-w-360 sm:overflow-hidden sm:rounded-lg sm:shadow-lg bg-default"
    >
      <router-outlet />
    </div>
  </main>

  <footer
    class="relative flex flex-0 justify-center w-full px-6 md:px-8 z-49 border-t bg-card print:hidden"
  >
    <div class="flex items-center w-full max-w-360 h-14 sm:h-20">
      <span class="font-medium text-secondary">{{
        'layout.footer.copyright' | transloco: { year: currentYear }
      }}</span>
    </div>
  </footer>
</div>
