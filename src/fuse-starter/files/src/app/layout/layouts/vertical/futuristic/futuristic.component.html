<ui-loading-bar />

<ui-vertical-navigation
  class="dark bg-indigo-800 text-white print:hidden"
  [name]="navigationName"
  [mode]="isScreenSmall() ? 'over' : 'side'"
  [opened]="!isScreenSmall()"
  [navigation]="navigation().futuristic"
  [ariaLabel]="'layout.mainNavigation' | transloco"
>
  <div uiVerticalNavigationContentHeader class="flex h-20 items-center p-6 pb-0">
    <img
      class="w-30"
      src="assets/images/logo/logo-text-on-dark.svg"
      [alt]="'layout.logoAlt' | transloco"
    />
  </div>

  <div uiVerticalNavigationFooter class="flex w-full items-center border-t px-6 py-8">
    <app-user />
    @if (user(); as user) {
      <div class="ml-4 flex w-full min-w-0 flex-col overflow-hidden">
        <div class="w-full truncate leading-normal text-current opacity-80">{{ user.name }}</div>
        <div class="mt-0.5 w-full truncate text-md leading-normal text-current opacity-50">
          {{ user.email }}
        </div>
      </div>
    }
  </div>
</ui-vertical-navigation>

<div class="flex w-full min-w-0 flex-auto flex-col">
  <app-vertical-header [showUser]="false" />

  <main class="flex w-full flex-auto flex-col">
    <router-outlet />
  </main>

  <app-vertical-footer />
</div>
