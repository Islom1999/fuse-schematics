<ui-loading-bar />

<ui-vertical-navigation
  class="dark bg-gray-900 print:hidden"
  appearance="compact"
  [name]="navigationName"
  [mode]="isScreenSmall() ? 'over' : 'side'"
  [opened]="!isScreenSmall()"
  [navigation]="navigation().compact"
  [ariaLabel]="'layout.mainNavigation' | transloco"
>
  <div uiVerticalNavigationContentHeader class="mb-4 mt-3 flex h-20 items-center justify-center">
    <img class="w-10" src="assets/images/logo/logo.svg" [alt]="'layout.logoAlt' | transloco" />
  </div>
</ui-vertical-navigation>

<div class="flex w-full min-w-0 flex-auto flex-col">
  <app-vertical-header />

  <main class="flex w-full flex-auto flex-col">
    <router-outlet />
  </main>

  <app-vertical-footer />
</div>
