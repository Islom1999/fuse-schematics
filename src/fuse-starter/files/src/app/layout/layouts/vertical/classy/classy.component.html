<ui-loading-bar />

<ui-vertical-navigation
  class="dark bg-gray-900 print:hidden"
  [name]="navigationName"
  [mode]="isScreenSmall() ? 'over' : 'side'"
  [opened]="!isScreenSmall()"
  [navigation]="navigation().default"
  [ariaLabel]="'layout.mainNavigation' | transloco"
>
  <div uiVerticalNavigationContentHeader>
    <div class="flex w-full items-center p-4 pl-6">
      <img class="w-8" src="assets/images/logo/logo.svg" [alt]="'layout.logoAlt' | transloco" />
      <div class="ml-auto flex items-center">
        <app-notifications />
        <app-user [showAvatar]="false" />
      </div>
    </div>

    @if (user(); as user) {
      <div class="flex w-full flex-col items-center p-4">
        <div class="relative h-24 w-24">
          @if (user.avatar) {
            <img class="h-full w-full rounded-full object-cover" [src]="user.avatar" alt="" />
          } @else {
            <div
              class="flex h-full w-full items-center justify-center rounded-full bg-gray-700 text-4xl font-semibold text-white"
              aria-hidden="true"
            >
              {{ initials() }}
            </div>
          }
        </div>
        <div class="mt-6 flex w-full flex-col items-center justify-center">
          <div class="w-full truncate text-center font-medium leading-normal">{{ user.name }}</div>
          <div
            class="mt-0.5 w-full truncate text-center text-md font-medium leading-normal text-secondary"
          >
            {{ user.email }}
          </div>
        </div>
      </div>
    }
  </div>

  <div
    uiVerticalNavigationContentFooter
    class="mb-4 mt-2 flex h-16 flex-0 items-center justify-center pl-2 pr-6 opacity-12"
  >
    <img class="max-w-36" src="assets/images/logo/logo-text-on-dark.svg" alt="" />
  </div>
</ui-vertical-navigation>

<div class="flex w-full min-w-0 flex-auto flex-col">
  <app-vertical-header [showNotifications]="false" [showUser]="false" />

  <main class="flex w-full flex-auto flex-col">
    <router-outlet />
  </main>
</div>
