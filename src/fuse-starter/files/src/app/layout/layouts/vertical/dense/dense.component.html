<ui-loading-bar />

<ui-vertical-navigation
  class="dark bg-gray-900 print:hidden"
  [appearance]="appearance()"
  [name]="navigationName"
  [mode]="isScreenSmall() ? 'over' : 'side'"
  [opened]="!isScreenSmall()"
  [navigation]="navigation().default"
  [ariaLabel]="'layout.mainNavigation' | transloco"
>
  <div uiVerticalNavigationContentHeader class="flex h-20 items-center justify-center">
    <img class="w-8" src="assets/images/logo/logo.svg" [alt]="'layout.logoAlt' | transloco" />
  </div>
</ui-vertical-navigation>

<div class="flex w-full min-w-0 flex-auto flex-col">
  <app-vertical-header>
    <button
      type="button"
      pButton
      class="p-button-icon-only hidden h-10 w-10 p-0 md:inline-flex"
      [text]="true"
      [rounded]="true"
      [attr.aria-label]="'layout.toggleAppearance' | transloco"
      [attr.aria-pressed]="appearance() === 'dense'"
      (click)="toggleAppearance()"
    >
      <ui-icon class="size-6" svgIcon="heroicons_outline:arrows-right-left" />
    </button>
  </app-vertical-header>

  <main class="flex w-full flex-auto flex-col">
    <router-outlet />
  </main>

  <app-vertical-footer />
</div>
