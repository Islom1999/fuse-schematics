<button
  type="button"
  pButton
  class="p-button-icon-only h-10 w-10 rounded-full p-0"
  [text]="true"
  [rounded]="true"
  aria-haspopup="menu"
  [attr.aria-label]="'languages.menu' | transloco"
  (click)="popover.toggle($event)"
>
  <ng-container *ngTemplateOutlet="flag; context: { $implicit: activeFlag() }" />
</button>

<p-popover #popover appendTo="body">
  <ul class="py-2" role="menu" [attr.aria-label]="'languages.menu' | transloco">
    @for (lang of langs; track lang) {
      <li role="none">
        <button
          type="button"
          role="menuitemradio"
          class="flex w-full cursor-pointer items-center px-4 py-2 text-left hover:bg-gray-100 dark:hover:bg-hover"
          [attr.aria-checked]="lang === activeLang()"
          (click)="setActiveLang(lang)"
        >
          <ng-container *ngTemplateOutlet="flag; context: { $implicit: flagUrl(lang) }" />
          <span class="ml-3" [class.font-medium]="lang !== activeLang()" [class.font-semibold]="lang === activeLang()">
            {{ 'languages.' + lang | transloco }}
          </span>
        </button>
      </li>
    }
  </ul>
</p-popover>

<ng-template #flag let-src>
  <span class="relative flex w-6 shrink-0 overflow-hidden rounded-sm shadow">
    <img class="w-full" alt="" [src]="src" />
    <span class="pointer-events-none absolute inset-0 rounded-sm ring-1 ring-inset ring-black/10"></span>
  </span>
</ng-template>
