<button
  type="button"
  pButton
  class="p-button-icon-only h-10 w-10 rounded-full p-0"
  [text]="true"
  [rounded]="true"
  aria-haspopup="menu"
  [attr.aria-label]="'user.menu' | transloco"
  (click)="statusOpen.set(false); popover.toggle($event)"
>
  <span class="relative flex">
    @if (showAvatar() && user()?.avatar) {
      <img class="h-7 w-7 rounded-full object-cover" alt="" [src]="user()?.avatar" />
    } @else if (showAvatar() && initials()) {
      <span
        class="flex h-7 w-7 items-center justify-center rounded-full bg-primary-100 text-sm font-semibold text-primary-800"
        aria-hidden="true"
      >
        {{ initials() }}
      </span>
    } @else {
      <ui-icon svgIcon="heroicons_outline:user-circle" />
    }
    @if (statusDot(); as dot) {
      <span class="absolute bottom-0 right-0 h-2 w-2 rounded-full ring-2 ring-bg-card" [class]="dot"></span>
    }
  </span>
</button>

<p-popover #popover appendTo="body">
  <ng-template #content>
    <div class="min-w-60 py-1" role="menu" [attr.aria-label]="'user.menu' | transloco">
      <div class="mb-1 border-b px-4 pb-2 pt-3">
        <div class="text-xs font-medium uppercase text-secondary">{{ 'user.signedInAs' | transloco }}</div>
        <div class="mt-2 truncate text-sm font-medium">{{ user()?.email }}</div>
      </div>

      <button type="button" role="menuitem" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-md px-4 text-left text-sm hover:bg-gray-100 dark:hover:bg-hover" (click)="openRoute(profileRoute)">
        <ui-icon class="size-5" svgIcon="heroicons_outline:user-circle" />
        <span>{{ 'user.profile' | transloco }}</span>
      </button>
      <button type="button" role="menuitem" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-md px-4 text-left text-sm hover:bg-gray-100 dark:hover:bg-hover" (click)="openRoute(settingsRoute)">
        <ui-icon class="size-5" svgIcon="heroicons_outline:cog-8-tooth" />
        <span>{{ 'user.settings' | transloco }}</span>
      </button>

      @if (statusEnabled) {
        <div class="my-2 border-t" role="separator"></div>
        <button
          type="button"
          role="menuitem"
          class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-md px-4 text-left text-sm hover:bg-gray-100 dark:hover:bg-hover"
          [attr.aria-expanded]="statusOpen()"
          (click)="statusOpen.set(!statusOpen())"
        >
          <ui-icon class="size-5" svgIcon="heroicons_outline:ellipsis-horizontal-circle" />
          <span>{{ 'user.status' | transloco }}</span>
          <ui-icon
            class="ml-auto size-4"
            [svgIcon]="statusOpen() ? 'heroicons_outline:chevron-up' : 'heroicons_outline:chevron-down'"
          />
        </button>
        @if (statusOpen()) {
          <div class="px-6 pb-1 pt-0.5" role="group" [attr.aria-label]="'user.status' | transloco">
            @for (status of statuses; track status.value) {
              <button
                type="button"
                role="menuitemradio"
                class="flex w-full cursor-pointer items-center gap-3 py-1.5 text-left text-sm hover:text-primary"
                [attr.aria-checked]="user()?.status === status.value"
                (click)="setStatus(status.value)"
              >
                <span class="h-3 w-3 shrink-0 rounded-full" [class]="status.dot"></span>
                <span>{{ status.label | transloco }}</span>
              </button>
            }
          </div>
        }
      }

      <div class="my-2 border-t" role="separator"></div>
      <button type="button" role="menuitem" class="flex h-11 w-full cursor-pointer items-center gap-3 rounded-md px-4 text-left text-sm hover:bg-gray-100 dark:hover:bg-hover text-red-500" (click)="signOut()">
        <ui-icon class="size-5" svgIcon="heroicons_outline:arrow-right-on-rectangle" />
        <span>{{ 'user.signOut' | transloco }}</span>
      </button>
    </div>
  </ng-template>
</p-popover>
