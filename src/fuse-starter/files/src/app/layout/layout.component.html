@switch (layout()) {
  @case ('empty') {
    <app-empty-layout />
  }
  @case ('classic') {
    <app-classic-layout />
  }
  @case ('classy') {
    <app-classy-layout />
  }
  @case ('compact') {
    <app-compact-layout />
  }
  @case ('dense') {
    <app-dense-layout />
  }
  @case ('futuristic') {
    <app-futuristic-layout />
  }
  @case ('thin') {
    <app-thin-layout />
  }
  @case ('centered') {
    <app-centered-layout />
  }
  @case ('enterprise') {
    <app-enterprise-layout />
  }
  @case ('material') {
    <app-material-layout />
  }
  @case ('modern') {
    <app-modern-layout />
  }
}

<app-settings />
